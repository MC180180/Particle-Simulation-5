[package]
name = "particle_sim_5"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "0.19", features = ["vulkan-portability"] }
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.15", features = ["derive"] }
rand = "0.8"
egui = "0.27.2"
egui-wgpu = "0.27.2"
egui-winit = "0.27.2"
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"
