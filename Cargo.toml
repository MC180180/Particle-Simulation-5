[package]
name = "particle_sim_5"
version = "0.1.0"
edition = "2021"

[lib]
name = "particle_sim_5"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "particle_sim_5_bin"
path = "src/main.rs"

[dependencies]
wgpu = { version = "0.19", features = ["vulkan-portability"] }
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.15", features = ["derive"] }
rand = "0.8"
egui = "0.27.2"
egui-wgpu = "0.27.2"
egui-winit = "0.27.2"
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.10"
ureq = { version = "3.3.0", features = ["json"] }
open = "5.3.5"
zip = "8.6.0"
imageproc = "0.26.2"
rusttype = "0.9.3"
ab_glyph = "0.2.32"
urlencoding = "2.1.3"
base64 = "0.22.1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.29", features = ["android-native-activity"] }
android-activity = { version = "0.5", features = ["native-activity"] }
android_logger = "0.13"

[package.metadata.android]
package = "com.particlesim.app"
build_targets = ["aarch64-linux-android"]
sdk_version = 35
target_sdk_version = 35
min_sdk_version = 24

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "123456"
key_alias = "particle_sim"
key_password = "123456"

[build-dependencies]
winres = "0.1"
cc = "1.0"



